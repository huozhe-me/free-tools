<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-Z 字母卡制作器</title><script src="https://cdn.tailwindcss.com"></script><style>@media print{.no-print{display:none!important}body{background:#fff!important}#preview{display:grid!important;grid-template-columns:repeat(2,1fr);gap:8mm}.card{break-inside:avoid;box-shadow:none!important}}</style></head><body class="bg-slate-50 text-slate-800 min-h-screen"><header class="no-print sticky top-0 z-10 bg-white/95 border-b"><div class="max-w-7xl mx-auto p-4 flex justify-between items-center"><div><h1 class="text-xl font-bold">A-Z 字母卡制作器</h1><p class="text-xs text-slate-500">2–5 岁 · 编辑 · 配图 · 打印</p></div><div class="flex gap-2"><button id="imp" class="px-3 py-2 border rounded-lg text-sm">导入</button><button id="exp" class="px-3 py-2 border rounded-lg text-sm">导出</button><button onclick="print()" class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm">打印</button><input id="fi" type="file" accept=".json" hidden></div></div></header><main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-[330px_1fr] gap-5"><aside class="no-print bg-white p-4 rounded-2xl border h-fit lg:sticky lg:top-20"><h2 class="font-semibold mb-3">编辑卡片</h2><div id="letters" class="grid grid-cols-4 gap-1 mb-4"></div><div id="editor"></div><select id="theme" class="mt-5 w-full border rounded-lg p-2"><option value="soft">柔和</option><option value="mono">黑白</option></select><button id="reset" class="mt-3 w-full border border-red-200 text-red-600 rounded-lg p-2 text-sm">恢复默认</button></aside><section><div class="no-print mb-3 font-semibold">预览 <span id="count" class="text-xs text-slate-400 font-normal"></span></div><div id="preview" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div></section></main><script>
const base=[['A','apple','苹果','A is for apple.','🍎'],['B','bus','公交车','B is for bus.','🚌'],['C','car','汽车','C is for car.','🚗'],['D','dog','狗','D is for dog.','🐶'],['E','egg','鸡蛋','E is for egg.','🥚'],['F','fish','鱼','F is for fish.','🐟'],['G','go','出发','G is for go.','👣'],['H','hat','帽子','H is for hat.','🧢'],['I','ice','冰','I is for ice.','🧊'],['J','jam','果酱','J is for jam.','🍓'],['K','key','钥匙','K is for key.','🔑'],['L','leg','腿','L is for leg.','🦵'],['M','mom','妈妈','M is for mom.','👩'],['N','nose','鼻子','N is for nose.','👃'],['O','orange','橙子','O is for orange.','🍊'],['P','pig','猪','P is for pig.','🐷'],['Q','queen','女王','Q is for queen.','👑'],['R','red','红色','R is for red.','🔴'],['S','sun','太阳','S is for sun.','☀️'],['T','toy','玩具','T is for toy.','🧸'],['U','up','向上','U is for up.','⬆️'],['V','van','小货车','V is for van.','🚐'],['W','water','水','W is for water.','💧'],['X','x-ray','X光','X is for x-ray.','🩻'],['Y','yellow','黄色','Y is for yellow.','🟡'],['Z','zoo','动物园','Z is for zoo.','🦁']];const defaults=base.map(x=>({letter:x[0],word:x[1],cn:x[2],sentence:x[3],emoji:x[4],image:''}));let cards=JSON.parse(localStorage.getItem('az-cards')||'null')||defaults,sel='A';const $=id=>document.getElementById(id), esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem('az-cards',JSON.stringify(cards))}function current(){return cards.find(c=>c.letter===sel)||cards[0]}function renderLetters(){$('letters').innerHTML=cards.map(c=>`<button class="rounded p-2 text-sm font-semibold ${c.letter===sel?'bg-slate-900 text-white':'bg-slate-100'}" onclick="sel='${c.letter}';render()">${c.letter}</button>`).join('')}function renderEditor(){let c=current();$('editor').innerHTML=`<label class="text-sm">英文单词<input id="word" value="${esc(c.word)}" class="mt-1 mb-3 w-full border rounded-lg p-2"></label><label class="text-sm">中文<input id="cn" value="${esc(c.cn)}" class="mt-1 mb-3 w-full border rounded-lg p-2"></label><label class="text-sm">句子<textarea id="sentence" rows="2" class="mt-1 mb-3 w-full border rounded-lg p-2">${esc(c.sentence)}</textarea></label><label class="text-sm block">图片<label class="mt-1 h-24 border-2 border-dashed rounded-xl flex items-center justify-center cursor-pointer overflow-hidden">${c.image?`<img src="${c.image}" class="h-full max-w-full object-contain">`:'<span class="text-slate-400 text-sm">点击上传</span>'}<input id="image" type="file" accept="image/*" hidden></label></label>`;['word','cn','sentence'].forEach(id=>$(id).oninput=e=>{c[id]=e.target.value;save();renderPreview()});$('image').onchange=e=>{let r=new FileReader();r.onload=()=>{c.image=r.result;save();render()};r.readAsDataURL(e.target.files[0])}}function renderPreview(){let t=$('theme').value;$('preview').innerHTML=cards.map(c=>`<article class="card rounded-2xl border bg-white p-5 shadow-sm aspect-[4/5] flex flex-col ${t}"><div class="text-7xl font-black">${esc(c.letter)}</div><div class="flex-1 my-3 rounded-xl bg-slate-50 flex items-center justify-center overflow-hidden">${c.image?`<img src="${c.image}" class="max-h-full max-w-full object-contain">`:`<div class="text-7xl">${c.emoji}</div>`}</div><div class="text-2xl font-bold">${esc(c.word)}</div><div class="text-slate-500">${esc(c.cn)}</div><div class="text-sm mt-2 text-slate-600">${esc(c.sentence)}</div></article>`).join('');$('count').textContent=' · '+cards.length+' 张'}function render(){renderLetters();renderEditor();renderPreview()}$('theme').onchange=renderPreview;$('reset').onclick=()=>{if(confirm('恢复默认 A-Z？')){cards=defaults.map(x=>({...x}));sel='A';save();render()}};$('exp').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='az-cards.json';a.click()};$('imp').onclick=()=>$('fi').click();$('fi').onchange=e=>{let r=new FileReader();r.onload=()=>{try{cards=JSON.parse(r.result);sel=cards[0].letter;save();render()}catch{alert('JSON 格式错误')}};r.readAsText(e.target.files[0])};render();</script></body></html>
